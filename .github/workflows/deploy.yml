name: Build & Deploy

on:
  push:
    branches: [main]

jobs:
  # ─── Job 1: Frontend build check ──────────────────────────────────────────
  build-check:
    name: Frontend Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

  # ─── Job 2: Deploy backend to VPS ─────────────────────────────────────────
  deploy-vps:
    name: Deploy Backend to VPS
    runs-on: ubuntu-latest
    needs: build-check          # only runs if build-check passes

    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Sync backend files to VPS
        run: |
          rsync -avz --delete \
            --exclude='node_modules' \
            --exclude='uploads' \
            --exclude='.env' \
            --exclude='database' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            backend/ \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/store/api/

      - name: Install dependencies & restart PM2
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            set -e
            cd /var/www/store/api
            npm install --production --silent
            pm2 restart pos-api 2>/dev/null || pm2 start server.cjs --name pos-api
            pm2 save
            echo "✅ Backend deployed"
            pm2 status pos-api --no-color | head -6
          EOF
