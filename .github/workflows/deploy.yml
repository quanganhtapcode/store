name: Build & Deploy

on:
  push:
    branches: [main]

jobs:
  # --- Job 1: Frontend build check -------------------------------------------
  build-check:
    name: Frontend Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

  # --- Job 2: Deploy backend to VPS ------------------------------------------
  deploy-vps:
    name: Deploy Backend to VPS
    runs-on: ubuntu-latest
    needs: build-check

    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH key
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
          ssh-keygen -l -f ~/.ssh/deploy_key

      - name: Test SSH connection
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -v "$VPS_USER@$VPS_HOST" "echo SSH_OK"

      - name: Sync backend files to VPS
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: rsync -avz --delete --exclude='node_modules' --exclude='uploads' --exclude='.env' --exclude='database' -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" backend/ "$VPS_USER@$VPS_HOST:/var/www/store/api/"

      - name: Restart PM2
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no "$VPS_USER@$VPS_HOST" "cd /var/www/store/api && npm install --production --silent && (pm2 restart pos-api 2>/dev/null || pm2 start server.cjs --name pos-api) && pm2 save && echo deployed"
