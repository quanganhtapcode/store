name: Build & Deploy

on:
  push:
    branches: [main]

jobs:
  # ─── Job 1: Frontend build check ──────────────────────────────────────────
  build-check:
    name: Frontend Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

  # ─── Job 2: Deploy backend to VPS ─────────────────────────────────────────
  deploy-vps:
    name: Deploy Backend to VPS
    runs-on: ubuntu-latest
    needs: build-check          # only runs if build-check passes

    steps:
      - uses: actions/checkout@v4

      - name: Sync backend files to VPS
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz --delete --exclude='node_modules' --exclude='uploads' --exclude='.env'
          path: backend/
          remote_path: /var/www/store/api/
          remote_host: ${{ secrets.VPS_HOST }}
          remote_user: ${{ secrets.VPS_USER }}
          remote_key: ${{ secrets.VPS_SSH_KEY }}

      - name: Install dependencies & restart PM2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /var/www/store/api
            npm install --production --silent
            pm2 restart pos-api 2>/dev/null || pm2 start server.cjs --name pos-api
            pm2 save
            echo "✅ Backend deployed"
            pm2 status pos-api --no-color | head -6
